# fly.toml app configuration file generated for localpick-api on 2026-08-27T11:29:57+09:00

app = 'localpick-api'
primary_region = 'nrt'

[build]

[env]
  SERVER_ADDRESS = "0.0.0.0"
  SERVER_PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
