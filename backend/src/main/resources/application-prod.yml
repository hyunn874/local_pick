# Render 배포용 프로파일.
#
# 환경변수로 주입할 값
#   DATABASE_URL        : Render Postgres Internal Database URL (jdbc: 접두어 포함)
#   DATABASE_USERNAME   : DB 사용자명
#   DATABASE_PASSWORD   : DB 비밀번호
#   KTO_SERVICE_KEY     : 한국관광공사 인증키
#   MOIS_SERVICE_KEY    : 행정안전부 인증키 (미신청 시 비워둠)
#   KAKAO_REST_API_KEY  : 카카오 REST API 키 (카카오 콘솔 > 앱 키)
#   KAKAO_CLIENT_SECRET : 카카오 클라이언트 시크릿 (콘솔에서 "사용함" 설정 시 필수)
#   KAKAO_CALLBACK_URL  : 카카오 인가코드 콜백 URI (기본값: https://localpick-api.onrender.com/api/auth/kakao/callback)
spring:
  main:
    lazy-initialization: true   # Bean 을 기동 시 한꺼번에 올리지 않고 첫 요청 시 생성
    banner-mode: off
    log-startup-info: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5      # Render 무료 Postgres 커넥션 제한 대응
      minimum-idle: 0           # 기동 시 커넥션을 안 잡고 요청이 올 때 생성
      idle-timeout: 60000
  jpa:
    hibernate:
      # 초기 배포에는 update 로 스키마를 생성한다.
      # 시드 콘텐츠 투입(4주차) 전에 validate 로 전환하고 스키마는 SQL 로 관리할 것.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
        temp:
          use_jdbc_metadata_defaults: false
    open-in-view: false

localpick:
  scheduler:
    # 배포 환경에서만 주간 파이프라인을 돌린다.
    # 주의: Render 무료 인스턴스는 유휴 15분이면 잠든다. 잠든 동안은 예약 시각을
    # 통짜로 놓치므로 이 설정만으로는 주간 갱신을 보장할 수 없다.
    # 외부 핑(cron-job.org 등)으로 깨우거나, 토큰으로 보호한 관리자 실행 엔드포인트를
    # 따로 두는 과제가 남아 있다. (dev 컨트롤러는 local 프로파일 전용)
    enabled: true

server:
  port: ${PORT:8080}            # Render 가 PORT 환경변수로 포트를 지정한다
  tomcat:
    threads:
      max: 20                   # 무료 512MB 인스턴스에서 스레드 스택 메모리 절약
      min-spare: 2

logging:
  level:
    root: info
    com.localpick: info
